server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: user-management-service
  datasource:
    url: jdbc:postgresql://localhost:5432/USER_MANAGEMENT_DB
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
    #  Runs data.sql on every restart (idempotent)
    initialization-mode: always

  jpa:
    hibernate:
      ddl-auto: update                    # Updates schema only
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Executes data.sql after JPA tables are ready
  sql:
    init:
      mode: always
      continue-on-error: true             # Ignores errors if tables don't exist yet

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-gmail@gmail.com          # ? UPDATE THIS
    password: your-16-char-app-password     # ? UPDATE THIS
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        mime:
          encoding: UTF-8

jwt:
  secret: yslxqwertgdfhysecretjwtk2a$10$92IXUNpkjO0rOQ5byMiYe4oKoEa3Ro9llC
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:5173
  otp:
    length: 6
    expiry-minutes: 10
  frontend-url: http://localhost:5173

logging:
  level:
    com.jayanta.usermanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
