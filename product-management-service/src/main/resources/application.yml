server:
  port: 9090
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: product-management-service
  data:
    mongodb:
      auto-index-creation: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://192.168.*:*"
      - "capacitor://localhost"
      - "capacitor://*"
      - "file://*"
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 36000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  remove-broken-reference-definitions: true

# MongoDB Connection Configuration
# Set is-cloud-db=true to use URI style, false to use host/port/credentials style
mongodb:
  is-cloud-db: ${IS_CLOUD_DB:false}
  # Cloud (URI-based) — used when is-cloud-db=true
  uri: ${MONGODB_URI:}
  # Standalone (host/port/credentials) — used when is-cloud-db=false
  host: ${MONGODB_HOST:localhost}
  port: ${MONGODB_PORT:27017}
  database: ${MONGODB_DATABASE:product_management_db}
  username: ${MONGODB_USERNAME:}
  password: ${MONGODB_PASSWORD:}
  authentication-database: ${MONGODB_AUTH_DB:admin}

jwt:
  # Note: SAME SECRET AS USER MANAGEMENT SERVICE (shared)
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  cors:
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "http://192.168.*:*"
      - "capacitor://localhost"
      - "capacitor://*"
      - "file://*"  # Desktop Electron apps
  frontend-url: http://localhost:5173

logging:
  level:
    com.jayanta.projectmanagement: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb.core: DEBUG
    org.springframework.web: DEBUG